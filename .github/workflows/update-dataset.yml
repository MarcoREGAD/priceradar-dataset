name: Update dataset

# Le collecteur tourne deux fois par jour, vers 07:00 et 15:00 UTC. Ces deux
# executions demarrent peu apres, pour qu'un commit suive l'arrivee des
# nouvelles observations. La troisieme, juste apres minuit, rattrape une
# collecte en retard afin qu'aucune journee ne soit sautee.
on:
  schedule:
    - cron: "20 8 * * *"
    - cron: "20 16 * * *"
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dataset
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Toute la logique — export, graphique, validation, commit conditionnel —
      # vit dans scripts/update.sh, que l'image Docker execute aussi. Une seule
      # implementation, deux declencheurs : le comportement ne peut pas diverger
      # entre le workflow et le conteneur.
      - name: Update the dataset
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PUSH: "true"
        run: bash scripts/update.sh
